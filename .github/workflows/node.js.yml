name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
    - uses: actions/checkout@v4

    # Setup Node.js
    - name: Set up Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    # Cache Backend dependencies
    - name: Cache Backend dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.npm
        key: backend-${{ runner.os }}-node-${{ matrix.node-version }}-${{ hashFiles('elearning-backend/package-lock.json') }}
        restore-keys: |
          backend-${{ runner.os }}-node-${{ matrix.node-version }}-
    - name: Install Backend dependencies
      working-directory: Elearning-server
      run: npm install --legacy-peer-deps

    - name: Build Backend
      working-directory: Elearning-server
      run: npm run build --if-present

    - name: Test Backend
      working-directory: Elearning-server
      run: npm test

    # Cache Frontend dependencies
    - name: Cache Frontend dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.npm
        key: frontend-${{ runner.os }}-node-${{ matrix.node-version }}-${{ hashFiles('elearning-frontend/package-lock.json') }}
        restore-keys: |
          frontend-${{ runner.os }}-node-${{ matrix.node-version }}-
    - name: Install Frontend dependencies
      working-directory: Elearning-frontend
      run: npm install --legacy-peer-deps

    # Install missing testing-library DOM dependency
    - name: Install @testing-library/dom
      working-directory: Elearning-frontend
      run: npm install @testing-library/dom --save-dev

    - name: Verify server URL in index.js (only on main branch)
      if: github.ref == 'refs/heads/main'
      run: |
        if grep -q 'export const server = "https://elearning-22.onrender.com";' Elearning-frontend/src/index.js; then
          echo "✅ Server URL is correct."
        else
          echo "❌ Server URL is incorrect!"
          exit 1
        fi


    

    - name: Set CI environment variable to false
      run: echo "CI=false" >> $GITHUB_ENV

    - name: Build Frontend
      working-directory: Elearning-frontend
      run: npm run build --if-present

    - name: Test Frontend
      working-directory: Elearning-frontend
      run: npm test
